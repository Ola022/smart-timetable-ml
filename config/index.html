<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Timetable Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        .sidebar {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .sidebar h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .model-selection {
            margin-bottom: 25px;
        }

        .model-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .model-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .model-card.selected {
            border-color: #667eea;
            background: #e7eaff;
        }

        .model-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .model-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9em;
        }

        .metric {
            background: white;
            padding: 8px;
            border-radius: 5px;
        }

        .metric-label {
            color: #999;
            font-size: 0.8em;
            margin-bottom: 3px;
        }

        .metric-value {
            color: #667eea;
            font-weight: bold;
        }

        .controls {
            margin-top: 25px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .content-area {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .content-area h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .timetable-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            background: #f8f9fa;
            color: #333;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Smart Timetable Scheduler</h1>
            <p>AI-Powered Academic Scheduling with Machine Learning</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h2>🤖 Model Selection</h2>
                
                <div class="model-selection" id="modelSelection">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Loading models...</p>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-primary" onclick="generateTimetable()" id="generateBtn">
                        🚀 Generate Timetable
                    </button>
                    <button class="btn btn-secondary" onclick="loadLatestTimetable()" id="loadBtn">
                        📂 Load Latest
                    </button>
                </div>

                <div id="executionInfo" style="margin-top: 20px; display: none;">
                    <div class="alert alert-success">
                        <strong>✓ Completed</strong><br>
                        Model: <span id="modelUsed"></span><br>
                        Time: <span id="executionTime"></span>s
                    </div>
                </div>
            </div>

            <div class="content-area">
                <h2>📊 Schedule Results</h2>
                
                <div id="resultsArea">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>Select a model and generate timetable</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let selectedModel = 'RandomForest';
        let availableModels = [];

        // Load models on startup
        async function loadModels() {
            try {
                const response = await fetch(`${API_BASE}/api/models`);
                const models = await response.json();
                availableModels = models;
                renderModels(models);
            } catch (error) {
                console.error('Failed to load models:', error);
                document.getElementById('modelSelection').innerHTML = `
                    <div class="alert alert-error">
                        Failed to load models. Make sure the API server is running.
                    </div>
                `;
            }
        }

        function renderModels(models) {
            const container = document.getElementById('modelSelection');
            container.innerHTML = '';
            
            models.forEach(model => {
                const card = document.createElement('div');
                card.className = `model-card ${model.name === selectedModel ? 'selected' : ''}`;
                card.onclick = () => selectModel(model.name);
                
                card.innerHTML = `
                    <h3>${model.name}</h3>
                    <div class="model-metrics">
                        <div class="metric">
                            <div class="metric-label">Accuracy</div>
                            <div class="metric-value">${(model.accuracy * 100).toFixed(2)}%</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">ROC AUC</div>
                            <div class="metric-value">${model.roc_auc.toFixed(4)}</div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function selectModel(modelName) {
            selectedModel = modelName;
            renderModels(availableModels);
        }

        async function generateTimetable() {
            const btn = document.getElementById('generateBtn');
            const resultsArea = document.getElementById('resultsArea');
            
            btn.disabled = true;
            btn.textContent = '⏳ Generating...';
            resultsArea.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Generating timetable with ${selectedModel} model...</p>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}/api/schedule`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model_name: selectedModel,
                        max_attempts: 5,
                        use_ml: selectedModel !== 'Basic'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result);
                    showExecutionInfo(result.model_used, result.execution_time);
                } else {
                    throw new Error(result.message || 'Scheduling failed');
                }
            } catch (error) {
                console.error('Scheduling failed:', error);
                resultsArea.innerHTML = `
                    <div class="alert alert-error">
                        <strong>❌ Error</strong><br>
                        ${error.message}
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Generate Timetable';
            }
        }

        async function loadLatestTimetable() {
            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading latest timetable...</p>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE}/api/timetable/latest`);
                const result = await response.json();
                
                if (result.success) {
                    displayTimetableTable(result.timetable);
                } else {
                    throw new Error('Failed to load timetable');
                }
            } catch (error) {
                console.error('Failed to load timetable:', error);
                resultsArea.innerHTML = `
                    <div class="alert alert-error">
                        <strong>❌ Error</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        function displayResults(result) {
            const resultsArea = document.getElementById('resultsArea');
            
            let unscheduledHtml = '';
            if (result.unscheduled_list.length > 0) {
                unscheduledHtml = `
                    <div class="alert alert-error">
                        <strong>⚠️ Unscheduled Courses (${result.unscheduled_list.length})</strong><br>
                        ${result.unscheduled_list.map(c => `${c.course_code}: ${c.reason}`).join('<br>')}
                    </div>
                `;
            } else {
                unscheduledHtml = `
                    <div class="alert alert-success">
                        <strong>✓ All courses scheduled successfully!</strong>
                    </div>
                `;
            }
            
            resultsArea.innerHTML = `
                ${unscheduledHtml}
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${result.total_courses}</div>
                        <div class="stat-label">Total Courses</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${result.scheduled_courses}</div>
                        <div class="stat-label">Scheduled</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${(result.coverage * 100).toFixed(1)}%</div>
                        <div class="stat-label">Coverage</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${result.score.toFixed(3)}</div>
                        <div class="stat-label">Quality Score</div>
                    </div>
                </div>
                
                <h3>📅 Timetable</h3>
                <div class="timetable-container">
                    ${generateTimetableTable(result.timetable)}
                </div>
            `;
        }

        function displayTimetableTable(timetable) {
            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = `
                <h3>📅 Timetable (${timetable.length} entries)</h3>
                <div class="timetable-container">
                    ${generateTimetableTable(timetable)}
                </div>
            `;
        }

        function generateTimetableTable(timetable) {
            if (!timetable || timetable.length === 0) {
                return '<p>No timetable data available</p>';
            }
            
            const headers = Object.keys(timetable[0]);
            const headerRow = headers.map(h => `<th>${h}</th>`).join('');
            
            const rows = timetable.slice(0, 50).map(row => {
                const cells = headers.map(h => `<td>${row[h]}</td>`).join('');
                return `<tr>${cells}</tr>`;
            }).join('');
            
            return `
                <table>
                    <thead>
                        <tr>${headerRow}</tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>
                ${timetable.length > 50 ? `<p><em>Showing first 50 of ${timetable.length} entries</em></p>` : ''}
            `;
        }

        function showExecutionInfo(model, time) {
            const infoDiv = document.getElementById('executionInfo');
            document.getElementById('modelUsed').textContent = model;
            document.getElementById('executionTime').textContent = time.toFixed(2);
            infoDiv.style.display = 'block';
        }

        // Initialize
        loadModels();
    </script>
</body>
</html>
